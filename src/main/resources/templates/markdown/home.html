<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${htmlConfig.title}">Markdown Viewer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
    <th:block th:each="css : ${htmlConfig.css}">
        <link rel="stylesheet" th:href="${css}">
    </th:block>
    <th:block th:if="${htmlConfig.injectHead}" th:utext="${htmlConfig.injectHead}"></th:block>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #24292e;
            line-height: 1.5;
        }
        h1 { margin-bottom: 4px; }
        ul { list-style: none; padding: 0; }
        li { margin: 12px 0; }
        a { color: #0366d6; text-decoration: none; font-size: 1.05rem; }
        a:hover { text-decoration: underline; }
        .source-card {
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 12px 16px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        .source-card:hover { background: #f6f8fa; }
        p.empty { color: #6a737d; }
        .tagline { margin: 0 0 24px; padding-bottom: 20px; border-bottom: 1px solid #eaecef; font-size: 1.1rem; color: #6a737d; }
    </style>
</head>
<body>
    <h1>Blend</h1>
    <p class="tagline" th:text="${htmlConfig.title}">Markdown Viewer</p>

    <th:block th:if="${#lists.isEmpty(sources)}">
        <p class="empty">No sources configured. Add sources to <code>application.yml</code> under <code>app.markdown-viewer.sources</code>.</p>
    </th:block>

    <ul th:unless="${#lists.isEmpty(sources)}">
        <li th:each="source : ${sources}">
            <a th:href="${source.url()}" class="source-card" th:text="${source.name()}">Source</a>
        </li>
    </ul>

    <th:block th:if="${htmlConfig.injectBodyEnd}" th:utext="${htmlConfig.injectBodyEnd}"></th:block>
</body>
</html>
